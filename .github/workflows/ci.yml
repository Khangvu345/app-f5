name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test -- --ci --runInBand

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Start application and check database migration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: appdb
          DB_USER: app
          DB_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret-0123456789abcdef-0123456789abcdef
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)
          if [ -z "$jar_file" ]; then
            echo 'Executable JAR was not created.'
            exit 1
          fi
          java -jar "$jar_file" > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              echo 'Backend started successfully with PostgreSQL.'
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo 'Backend exited before becoming healthy.'
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 2
          done
          echo 'Backend did not become healthy in time.'
          cat "$RUNNER_TEMP/backend.log"
          exit 1
