          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      operationId: updateAdminPlanLimits
      summary: Chỉnh hạn mức 1 gói
      description: >
        UC-16. Chỉ role ADMIN. Chỉnh số lượt gợi ý tối đa/ngày và số sản phẩm
        tối đa/lượt (X/Y của Premium) hoặc giới hạn người nhận. Giá trị âm hoặc
        thiếu trường bắt buộc trả 400. Thay đổi áp dụng ngay (real-time).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanLimitsUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      tags: [Admin]
      operationId: getAdminUsers
      summary: Liệt kê tài khoản người dùng
      description: >
        UC-16. Chỉ role ADMIN. Danh sách tài khoản để Admin chọn khi cấp
        trial Premium hoặc đổi gói. Lọc theo plan_type, role, status và
        tìm theo email.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
            description: Tìm theo email hoặc tên hiển thị
        - name: plan_type
          in: query
          required: false
          schema:
            type: string
            enum: [FREE, PREMIUM]
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [USER, ADMIN]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DISABLED, DELETED]
      responses:
        '200':
          description: Danh sách tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/trial-premium:
    post:
      tags: [Admin]
      operationId: grantTrialPremium
      summary: Cấp Premium thử nghiệm cho 1 tài khoản
      description: >
        UC-16, Q5 (CHỜ NHÓM). Chỉ role ADMIN. v1 chỉ set plan_type=PREMIUM,
        chưa có premium_until vì Q5 chưa chốt — endpoint này KHÔNG có body.
        Khi nhóm chốt ngày hết hạn, v1.1 sẽ thêm trường premium_until
        (migration riêng) và body nhận expires_at.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Cấp Premium xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{id}/plan:
    patch:
      tags: [Admin]
      operationId: updateUserPlan
      summary: Đổi gói của 1 tài khoản
      description: >
        UC-16. Chỉ role ADMIN. Nâng/hạ gói FREE/PREMIUM của user (không cần
        ngày hết hạn ở v1 — xem POST /admin/users/{id}/trial-premium).
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      responses:
        '200':
          description: Đổi gói xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT (TTL 1h). Gửi trong header Authorization.
        Hết hạn thì dùng POST /auth/refresh để đổi token mới.
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang, bắt đầu từ 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Số bản ghi mỗi trang
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID BIGINT của bản ghi
  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa đăng nhập hoặc token hết hạn/sai
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không có quyền (không phải ADMIN, không phải chủ sở hữu, hoặc vượt hạn mức gói)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy bản ghi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột dữ liệu (trùng, chuyển trạng thái sai)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: Hết quota AI trong ngày
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AiNotImplemented:
      description: Nhóm AI chưa triển khai ở v1 (Q3)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi, vd VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, AI_QUOTA_EXCEEDED, AI_NOT_IMPLEMENTED, EXPORT_FORMAT_NOT_SUPPORTED, RECIPIENT_LIMIT_REACHED
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo lỗi đọc được (tiếng Việt)
          example: Tên người nhận không được để trống
        details:
          type: array
          description: Chi tiết từng lỗi field (nếu có)
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: Không được để trống
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: khanh@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          description: Mật khẩu tối thiểu 8 ký tự
        display_name:
          type: string
          maxLength: 100
          example: Khánh
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: khanh@example.com
        password:
          type: string
          format: password
    OAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: ID token do Google hoặc Apple cấp sau khi user đăng nhập trên app
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token nhận được lúc đăng nhập (server chỉ lưu hash SHA-256)
    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT access token, TTL 1h
        refresh_token:
          type: string
          description: Refresh token, hết hạn sau 30 ngày; xoay vòng mỗi lần refresh
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: TTL của access token tính bằng giây
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'
    SyncRequest:
      type: object
      description: >
        Dữ liệu cục bộ của Guest gửi lên để gộp vào tài khoản (UC-01, D6).
        Mỗi mảng dùng đúng schema Create của tài nguyên tương ứng.
      properties:
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/RecipientCreate'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventCreate'
        gifts:
          type: array
          items:
            $ref: '#/components/schemas/GiftCreate'
    SyncResponse:
      type: object
      required: [recipients_created, events_created, gifts_created, skipped]
      properties:
        recipients_created:
          type: integer
          example: 3
        events_created:
          type: integer
          example: 2
        gifts_created:
          type: integer
          example: 5
        skipped:
          type: integer
          description: Số bản ghi bỏ qua vì đã tồn tại
          example: 1
    UserProfile:
      type: object
      description: >
        Hồ sơ gộp users + user_settings cho GET /users/me. Trường user là
        object lồng (suy ra, không phải cột DB).
      required: [id, email, display_name, role, status, plan_type]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: [string, "null"]
          format: email
          description: NULL với tài khoản chỉ đăng nhập OAuth chưa nhập email
        auth_provider:
          type: [string, "null"]
          enum: [EMAIL, GOOGLE, APPLE]
          description: >
            Cách đăng nhập (bảng users.auth_provider, Q2: không có FACEBOOK)
        display_name:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        locale:
          type: string
          example: vi
        currency:
          type: string
          example: VND
        created_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: Mật khẩu hiện tại để xác nhận xóa tài khoản (D14, v1 chưa có OTP)
    UserSettings:
      type: object
      description: Map 1-1 bảng user_settings
      required: [display_name, timezone, locale, currency, default_reminder_time, default_reminder_offsets, notifications_enabled, hide_gift_on_lockscreen, ai_enabled, plan_type]
      properties:
        display_name:
          type: string
          maxLength: 100
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
          example: Asia/Ho_Chi_Minh
        locale:
          type: string
          default: vi
          example: vi
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: VND
          example: VND
        default_reminder_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          default: '09:00'
          description: Giờ nhắc mặc định, định dạng HH:mm
          example: '09:00'
        default_reminder_offsets:
          type: array
          description: Các mốc nhắc mặc định (số ngày trước sự kiện)
          default: [14, 7, 3, 1, 0]
          items:
            type: integer
            enum: [14, 7, 3, 1, 0]
        notifications_enabled:
          type: boolean
          default: true
        hide_gift_on_lockscreen:
          type: boolean
          default: true
        ai_enabled:
          type: boolean
          default: true
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
    UserSettingsUpdate:
      type: object
      properties:
        timezone:
          type: string
        locale:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        default_reminder_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        default_reminder_offsets:
          type: array
          items:
            type: integer
            enum: [14, 7, 3, 1, 0]
        notifications_enabled:
          type: boolean
        hide_gift_on_lockscreen:
          type: boolean
        ai_enabled:
          type: boolean
    ExportData:
      type: object
      description: Toàn bộ dữ liệu cá nhân của user, xuất dạng JSON (UC-03)
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        settings:
          $ref: '#/components/schemas/UserSettings'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        gifts:
          type: array
          items:
            $ref: '#/components/schemas/Gift'
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
        exported_at:
          type: string
          format: date-time
    PlanLimit:
      type: object
      description: Map 1-1 bảng plan_limits
      required: [plan_type, limit_key, limit_value]
      properties:
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
        limit_key:
          type: string
          enum: [recipient_limit, ai_requests_per_day, active_gift_ideas]
        limit_value:
          type: [integer, "null"]
          description: NULL = chưa điền, server chặn fail-closed, không coi là không giới hạn
          example: 20
        unit:
          type: [string, "null"]
          example: nguoi
    PlanLimitsUpdate:
      type: object
      required: [plan_type, limits]
      properties:
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
        limits:
          type: array
          minItems: 1
          items:
            type: object
            required: [limit_key, limit_value]
            properties:
              limit_key:
                type: string
                enum: [recipient_limit, ai_requests_per_day, active_gift_ideas]
              limit_value:
                type: [integer, "null"]
                minimum: 0
                description: Đặt NULL để đánh dấu chưa điền (fail-closed)
    PlanUpdate:
      type: object
      required: [plan_type]
      properties:
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
    AdminUser:
      type: object
      description: Tài khoản user nhìn từ phía Admin (UC-16)
      required: [id, email, display_name, role, status, plan_type]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
        created_at:
          type: string
          format: date-time
    AdminUserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    Recipient:
      type: object
      description: Map 1-1 bảng recipients
      required: [id, name, is_favourite]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 150
        relationship:
          type: [string, "null"]
          enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
        relationship_detail:
          type: [string, "null"]
          maxLength: 100
          description: Ghi chú thêm về mối quan hệ, vd "Bạn đại học"
        age_group:
          type: [string, "null"]
          enum: [CHILD, TEEN, ADULT, SENIOR, UNKNOWN]
        birth_day:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: Đi cùng birth_month (cả hai có hoặc cả hai không)
        birth_month:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        birth_year:
          type: [integer, "null"]
        notes:
          type: [string, "null"]
          maxLength: 500
        is_favourite:
          type: boolean
          default: false
        version:
          type: integer
          description: Optimistic locking (cột version của bảng)
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RecipientCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 150
        relationship:
          type: string
          enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
        relationship_detail:
          type: string
          maxLength: 100
        age_group:
          type: string
          enum: [CHILD, TEEN, ADULT, SENIOR, UNKNOWN]
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
        birth_year:
          type: integer
        notes:
          type: string
          maxLength: 500
        is_favourite:
          type: boolean
    RecipientUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        relationship:
          type: string
          enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
        relationship_detail:
          type: string
          maxLength: 100
        age_group:
          type: string
          enum: [CHILD, TEEN, ADULT, SENIOR, UNKNOWN]
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
        birth_year:
          type: integer
        notes:
          type: string
          maxLength: 500
        is_favourite:
          type: boolean
    RecipientPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 3
    RecipientPreference:
      type: object
      description: Map 1-1 bảng recipient_preferences
      required: [id, recipient_id, category, value, polarity, source, is_active]
      properties:
        id:
          type: integer
          format: int64
        recipient_id:
          type: integer
          format: int64
        category:
          type: string
          maxLength: 80
          example: Đồ ăn
        value:
          type: string
          maxLength: 200
          example: Trà sữa
        polarity:
          type: string
          enum: [LIKE, DISLIKE, AVOID]
        source:
          type: string
          enum: [USER, AI_INFERRED]
        confirmed_at:
          type: [string, "null"]
          format: date-time
          description: Thời điểm user xác nhận sở thích do AI suy ra
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RecipientPreferenceCreate:
      type: object
      required: [category, value, polarity]
      properties:
        category:
          type: string
          maxLength: 80
        value:
          type: string
          maxLength: 200
        polarity:
          type: string
          enum: [LIKE, DISLIKE, AVOID]
        source:
          type: string
          enum: [USER, AI_INFERRED]
          default: USER
    RecipientPreferenceUpdate:
      type: object
      properties:
        value:
          type: string
          maxLength: 200
        polarity:
          type: string
          enum: [LIKE, DISLIKE, AVOID]
        is_active:
          type: boolean
        confirmed_at:
          type: string
          format: date-time
    RecipientPreferencePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecipientPreference'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 2
    Event:
      type: object
      description: Map 1-1 bảng events
      required: [id, title, event_type, calendar_type, original_day, original_month, recurrence_frequency]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 150
        event_type:
          type: string
          enum: [BIRTHDAY, ANNIVERSARY, WEDDING, GRADUATION, HOLIDAY, CUSTOM]
        occasion_type:
          type: [string, "null"]
          enum: [BIRTHDAY, ANNIVERSARY, HOLIDAY, OTHER]
        calendar_type:
          type: string
          enum: [SOLAR, LUNAR]
          default: SOLAR
        original_day:
          type: integer
          minimum: 1
          maximum: 31
        original_month:
          type: integer
          minimum: 1
          maximum: 12
        original_year:
          type: [integer, "null"]
        is_year_known:
          type: boolean
          default: true
        is_lunar_leap_month:
          type: boolean
          default: false
        recurrence_frequency:
          type: string
          enum: [NONE, ANNUAL]
          default: ANNUAL
        leap_day_policy:
          type: [string, "null"]
          enum: [FEB28, MAR01, SKIP]
          description: Cách xử lý ngày 29/2 vào năm không nhuận
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
        start_date:
          type: [string, "null"]
          format: date
        end_date:
          type: [string, "null"]
          format: date
        default_budget:
          type: [number, "null"]
