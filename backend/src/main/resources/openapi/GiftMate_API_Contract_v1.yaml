              $ref: '#/components/schemas/AiSuggestionRequest'
      responses:
        '200':
          description: Danh sách gợi ý AI (chỉ có sau khi backend AI triển khai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequest'
        '501':
          $ref: '#/components/responses/AiNotImplemented'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
