        luôn trả 501 AI_NOT_IMPLEMENTED cho tới khi backend AI được làm.
        Khi triển khai: kiểm tra quota ngày (Free 2 lượt/ngày, tối đa 3 sản phẩm/lượt;
        Premium X lượt/ngày, Y sản phẩm/lượt theo cấu hình Admin — X/Y đang NULL
        nên fail-closed), loại trừ quà đã mua/tặng, gọi LLM, fallback sang danh sách
        phổ biến tĩnh + lịch sử khi AI lỗi/timeout (Q4). Hết quota trả 429.
      x-giftmate-implementation: planned
      requestBody:
