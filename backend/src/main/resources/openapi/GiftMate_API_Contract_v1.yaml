    AiSuggestion:
      type: object
      description: Map 1-1 bảng ai_suggestions (tối đa 5 gợi ý / 1 request)
      required: [id, request_id, position, title]
      properties:
        id:
          type: integer
          format: int64
        request_id:
          type: integer
          format: int64
        position:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 200
        category:
          type: [string, "null"]
          maxLength: 100
        estimated_price_min:
          type: [number, "null"]
        estimated_price_max:
          type: [number, "null"]
        reason:
          type: [string, "null"]
          description: Lý do AI gợi ý món này
        caution:
          type: [string, "null"]
          description: Lưu ý khi mua/tặng món này
        canonical_key:
          type: [string, "null"]
          maxLength: 150
        duplicate_gift_id:
          type: [integer, "null"]
          format: int64
          description: Món quà đã tặng trước đây trùng với gợi ý này (nếu có)
        hidden_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    AiRequest:
      type: object
      description: Map 1-1 bảng ai_requests (1 hàng / 1 lần gọi AI)
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        recipient_id:
          type: [integer, "null"]
          format: int64
        occurrence_id:
          type: [integer, "null"]
          format: int64
        budget_min:
          type: [number, "null"]
        budget_max:
          type: [number, "null"]
        additional_instruction:
          type: [string, "null"]
        status:
          type: string
          enum: [QUEUED, GENERATED, FAILED, PARTIAL]
        model_name:
          type: [string, "null"]
          maxLength: 100
        token_input:
          type: [integer, "null"]
        token_output:
          type: [integer, "null"]
        cost_cents:
          type: [integer, "null"]
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AiSuggestion'
          description: Tối đa 5 gợi ý, chỉ có khi lấy chi tiết 1 request
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    AiRequestPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiRequest'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 2
    AiQuota:
      type: object
      description: Quota AI của user trong ngày Việt Nam (reset 00:00 VN)
      required: [plan_type, requests_used_today, suggestions_per_request, quota_date]
      properties:
        plan_type:
          type: string
          enum: [FREE, PREMIUM]
        requests_used_today:
          type: integer
          description: Số lượt đã dùng hôm nay (chỉ tính GENERATED/PARTIAL)
          example: 1
        requests_per_day:
          type: [integer, "null"]
          description: >
            Hạn mức lượt/ngày. Free: 2 (UC-14). Premium: X theo cấu hình Admin.
            NULL = chưa điền, server chặn fail-closed.
          example: 2
        suggestions_per_request:
          type: integer
          description: >
            Số sản phẩm tối đa mỗi lượt. Free: 3 (UC-14). Premium: Y.
          example: 3
        quota_date:
          type: string
          format: date
          description: Ngày Việt Nam mà quota này áp dụng
    AiSuggestionSave:
      type: object
      properties:
        occurrence_id:
          type: integer
          format: int64
          description: Gắn món quà đã lưu vào 1 lần diễn ra (tùy chọn)
        note:
          type: string
          description: Ghi chú thêm khi lưu vào kho ý tưởng
    SuggestionFeedbackCreate:
      type: object
      description: >
        Phản hồi cho 1 gợi ý AI (UC-15, D12). Chỉ nhận lý do theo enum của
        suggestion_feedback; không có cảm xúc Thích/Không thích.
      properties:
        reason:
          type: [string, "null"]
          enum: [TOO_EXPENSIVE, ALREADY_GIVEN, NOT_MATCHING_INTERESTS, NOT_MATCHING_OCCASION, OTHER]
        detail:
          type: string
          description: Ghi chú thêm về phản hồi
    SuggestionFeedback:
      type: object
      description: Map 1-1 bảng suggestion_feedback (1 phản hồi / 1 gợi ý)
      required: [id, suggestion_id]
      properties:
        id:
          type: integer
          format: int64
        suggestion_id:
          type: integer
          format: int64
        reason:
          type: [string, "null"]
          enum: [TOO_EXPENSIVE, ALREADY_GIVEN, NOT_MATCHING_INTERESTS, NOT_MATCHING_OCCASION, OTHER]
        detail:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    AdminAiStats:
      type: object
      description: >
        1 hàng của view v_ai_daily_stats: thống kê theo ngày Việt Nam + model.
        Không có thời gian phản hồi trung bình và tỉ lệ lỗi/Fallback (D13).
      required: [stat_date, model, requests, failed_requests, total_tokens_in, total_tokens_out, total_cost_cents]
      properties:
        stat_date:
          type: string
          format: date
          description: Ngày theo giờ Việt Nam
        model:
          type: string
          description: Tên model, 'unknown' nếu không ghi model
          example: gpt-4o-mini
        requests:
          type: integer
          description: Số lượt gọi thành công (GENERATED/PARTIAL)
        failed_requests:
          type: integer
          description: Số lượt gọi lỗi (FAILED)
        total_tokens_in:
          type: integer
        total_tokens_out:
          type: integer
        total_cost_cents:
          type: integer
          description: Tổng chi phí API tính bằng cents
