      operationId: listEvents
      summary: Liệt kê sự kiện của mình
      description: >
        UC-06, UC-07. Lọc theo loại dịp (eventType) và khoảng ngày
        (startDate, endDate lọc theo localDate của lần diễn ra).
        Sắp xếp theo ngày diễn ra gần nhất.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
