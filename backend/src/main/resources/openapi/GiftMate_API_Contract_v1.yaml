      tags: [Sự kiện]
      operationId: getCalendar
      summary: Xem lịch theo tháng
      description: >
        UC-07. Trả các lần diễn ra (occurrence) trong khoảng from–to
        (mặc định tháng hiện tại theo Asia/Ho_Chi_Minh). Mỗi item gồm
