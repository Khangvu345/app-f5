        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sự kiện]
      operationId: createEvent
      summary: Tạo sự kiện mới
      description: >
        UC-06. Bắt buộc có ít nhất 1 người nhận (recipientIds, tối thiểu 1 phần tử)
        — DB có trigger deferred chặn lưu sự kiện không có người nhận. Tạo event
        và event_recipients trong cùng 1 transaction. Ngày không hợp lệ
        (vd. ngày 31 tháng 2, endDate trước startDate) trả 400.
