openapi: 3.1.0
info:
  title: GiftMate API
  version: 1.0.0
  description: >
    API contract v1 của GiftMate — nguồn duy nhất (contract-first, hướng A).
    Base path /api/v1. Auth: Bearer JWT, mọi dữ liệu scoping theo user_id.
    ID là BIGINT, truyền qua API dưới dạng chuỗi chữ số. Tiền VND NUMERIC(18,2).
    Ngày giờ ISO 8601 theo Asia/Ho_Chi_Minh. Xóa mềm (deleted_at), DELETE trả 204.
    Nhóm AI (UC-14/UC-15) có trong contract để đủ map 16 UC nhưng CHƯA TRIỂN KHAI
    ở đợt này (phát triển sau, Q3) — gọi endpoint AI trước khi triển khai sẽ trả 501.
    V1 cấp và thu hồi Premium thủ công qua PATCH /admin/users/{id}/plan. Trial tự hết hạn để sau v1.
    OAuth chỉ Google + Apple (Q2: bỏ Facebook khỏi UC-01, enum authProvider giữ EMAIL/GOOGLE/APPLE, không sửa DB).
  license:
    name: Chưa công bố — nội bộ dự án GiftMate
    identifier: LicenseRef-Proprietary
  contact:
    name: GiftMate
servers:
  - url: /api/v1
    description: Backend local theo application.yaml (port 8080)
tags:
  - name: Auth
    description: Đăng ký, đăng nhập, OAuth, refresh token, đồng bộ Guest (UC-01, UC-02)
  - name: Tài khoản
    description: Hồ sơ cá nhân, đổi mật khẩu, xuất/xóa dữ liệu (UC-02, UC-03)
  - name: Cài đặt
    description: Cài đặt người dùng (UC-02)
  - name: Người nhận
    description: Hồ sơ người nhận và sở thích (UC-04, UC-05)
  - name: Sự kiện
    description: Sự kiện lặp, lịch, lần diễn ra (UC-06, UC-07)
  - name: Nhắc nhở
    description: Quy tắc nhắc, thông báo, thiết bị push (UC-08)
  - name: Ngân sách
    description: Ngân sách năm/sự kiện và tổng hợp chi tiêu (UC-09, UC-10)
  - name: Quà và chi
    description: Ý tưởng quà, vòng đời quà, chi phí, kiểm tra trùng (UC-11, UC-12, UC-13)
  - name: AI
    description: Gợi ý quà AI, quota, phản hồi (UC-14, UC-15) — CHƯA TRIỂN KHAI ở v1
  - name: Admin
    description: Thống kê AI, hạn mức, cấp Premium (UC-16)
security:
  - BearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Đăng ký tài khoản mới bằng email
      description: >
        UC-01. Tạo tài khoản EMAIL (authProvider=EMAIL). Email phải duy nhất;
        trùng email trả 409. Tạo kèm user_settings mặc định (timezone
        Asia/Ho_Chi_Minh, locale vi, currency VND, plan FREE).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Đăng nhập bằng email/mật khẩu
      description: >
        UC-01. Sai email hoặc sai mật khẩu trả 401 (không phân biệt lý do).
        Trả access token (TTL 1h theo application.yaml) + refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/oauth/{provider}:
    post:
      tags: [Auth]
      operationId: oauthLogin
      summary: Đăng nhập bằng tài khoản Google hoặc Apple
      description: >
        UC-01. Chỉ hỗ trợ GOOGLE và APPLE (Q2: bỏ Facebook). Provider khác trả 400.
        Body chứa idToken do nhà cung cấp cấp. Lần đầu đăng nhập: tạo user mới
        (authProvider=GOOGLE/APPLE, provider_subject lấy từ idToken) + user_settings
        mặc định. Đã có tài khoản cùng provider_subject thì đăng nhập thẳng.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [GOOGLE, APPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Đổi refresh token lấy access token mới
      description: >
        UC-01, Q6. Server chỉ lưu hash SHA-256 của refresh token (bảng refresh_tokens),
        không lưu token gốc. Refresh thành công: thu hồi token cũ (revoked_at) và
        cấp refresh token mới (xoay vòng). Token hết hạn hoặc đã thu hồi trả 401.
        Refresh token hết hạn sau 30 ngày.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Đăng xuất, thu hồi refresh token
      description: >
        UC-02. Thu hồi refresh token gửi kèm (nếu có) và kết thúc phiên. Access token
        còn hạn vẫn dùng được tới khi hết TTL 1h (không có blacklist ở v1).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sync:
    post:
      tags: [Auth]
      operationId: syncGuestData
      summary: Đồng bộ dữ liệu Guest (cục bộ) vào tài khoản
      description: >
        UC-01 (D6). Sau khi Guest đăng ký/đăng nhập, gom dữ liệu cục bộ (người nhận,
        sự kiện, quà) gộp vào tài khoản. Server nhận diện bản ghi theo tài khoản, entityType và localId. Gửi lại trả cùng serverId. Chỉ nhận dữ liệu của chính
        user đang đăng nhập.
        Một lần nhập là một giao dịch: lỗi bất kỳ bản ghi hoặc tham chiếu local nào trả 400 và hủy toàn bộ lần nhập.
        Thành công trả mapping cho từng bản ghi, kể cả bản đã nhập. Mobile chỉ đánh dấu sau khi nhận đủ mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Đồng bộ xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags: [Tài khoản]
      operationId: getMe
      summary: Lấy hồ sơ của mình
      description: >
        UC-02. Trả thông tin users + user_settings gộp (displayName, planType,
        timezone, locale, currency). Không có trường avatar (D11: v2.2 không có
        cột avatar).
      responses:
        '200':
          description: Hồ sơ hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Tài khoản]
      operationId: updateMe
      summary: Cập nhật tên hiển thị
      description: >
        UC-02. Chỉ đổi được displayName (cột user_settings.displayName).
        Các cài đặt khác đổi qua PATCH /users/me/settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Tài khoản]
      operationId: deleteMe
      summary: Xóa tài khoản vĩnh viễn
      description: >
        UC-03, D14. Bắt buộc gửi mật khẩu hiện tại trong body để xác nhận
        (v1 chưa có hạ tầng OTP nên chỉ dùng mật khẩu). Sai mật khẩu trả 401
        và hủy tiến trình. Xóa mềm trước (deleted_at), dữ liệu liên quan
        cascade theo FK; tài khoản chuyển status DELETED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Tài khoản đã xóa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    patch:
      tags: [Tài khoản]
      operationId: changePassword
      summary: Đổi mật khẩu
      description: >
        UC-02. Mật khẩu cũ không đúng trả 400. Tài khoản đăng nhập bằng OAuth
        (không có password_hash) đổi mật khẩu trả 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu xong
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/export:
    get:
      tags: [Tài khoản]
      operationId: exportMe
      summary: Xuất dữ liệu cá nhân (JSON)
      description: >
        UC-03. Xuất toàn bộ dữ liệu của user (hồ sơ, người nhận, sự kiện, quà,
        chi phí, ngân sách) dạng JSON. Q8: v1 chỉ JSON, format=pdf trả 400
        (mã EXPORT_FORMAT_NOT_SUPPORTED). UC-03 nhắc xác nhận bằng mật khẩu/OTP:
        v1 chưa có hạ tầng OTP nên dùng xác nhận mật khẩu qua header
        X-Confirm-Password (không bắt buộc ở v1, ghi nhận để làm sau).
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json]
            default: json
      responses:
        '200':
          description: File dữ liệu JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/settings:
    get:
      tags: [Cài đặt]
      operationId: getMySettings
      summary: Lấy cài đặt của mình
      description: >
        UC-02. Trả toàn bộ hàng user_settings (múi giờ, ngôn ngữ, tiền tệ,
        giờ nhắc mặc định, các mốc nhắc, bật/tắt thông báo, ẩn quà ở màn hình
        khóa, bật AI, gói hiện tại).
      responses:
        '200':
          description: Cài đặt hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Cài đặt]
      operationId: updateMySettings
      summary: Cập nhật cài đặt
      description: >
        UC-02. Chỉ cập nhật các trường gửi kèm. defaultReminderOffsets chỉ
        nhận các mốc 14, 7, 3, 1, 0. planType không đổi qua endpoint này
        (đổi gói do Admin cấp qua UC-16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /recipients:
    get:
      tags: [Người nhận]
      operationId: listRecipients
      summary: Liệt kê người nhận của mình
      description: >
        UC-05. Tìm theo tên (search, không phân biệt hoa thường) và lọc theo
        mối quan hệ (relationship). Sắp xếp theo tên. Không trả bản ghi đã
        xóa mềm.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
            description: Từ khóa tìm theo tên người nhận
        - name: relationship
          in: query
          required: false
          schema:
            type: string
            enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
      responses:
        '200':
          description: Danh sách người nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Người nhận]
      operationId: createRecipient
      summary: Tạo người nhận mới
      description: >
        UC-04. Tên bắt buộc (bỏ trống trả 400). Gói Free giới hạn 20 người nhận
        (plan_limits FREE.recipient_limit); vượt giới hạn trả 403 mã
        RECIPIENT_LIMIT_REACHED. birthDay và birthMonth phải đi cùng nhau
        (cả hai có hoặc cả hai không) theo CHECK của DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientCreate'
      responses:
        '201':
          description: Tạo xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /recipients/{id}:
    get:
      tags: [Người nhận]
      operationId: getRecipient
      summary: Lấy 1 người nhận
      description: >
        UC-04. Chỉ thấy người nhận của chính mình; của người khác trả 404
        (không lộ sự tồn tại).
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Người nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Người nhận]
      operationId: updateRecipient
      summary: Sửa người nhận
      description: UC-04. Chỉ cập nhật các trường gửi kèm. Không phải chủ sở hữu trả 404.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Người nhận]
      operationId: deleteRecipient
      summary: Xóa người nhận
      description: >
        UC-04. Xóa mềm (deleted_at). Dữ liệu liên quan (sở thích, quà, event_recipients)
        cascade theo FK. Không phải chủ sở hữu trả 404.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /recipients/{id}/preferences:
    get:
      tags: [Người nhận]
      operationId: listPreferences
      summary: Liệt kê sở thích của 1 người nhận
      description: >
        UC-04. Lọc theo polarity (LIKE/DISLIKE/AVOID). Mặc định chỉ trả
        sở thích đang hoạt động (isActive=true); truyền includeInactive=true
        để lấy cả sở thích đã tắt.
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: polarity
          in: query
          required: false
          schema:
            type: string
            enum: [LIKE, DISLIKE, AVOID]
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Danh sách sở thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreferencePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Người nhận]
      operationId: createPreference
      summary: Thêm sở thích cho người nhận
      description: >
        UC-04. Trùng sở thích (cùng recipient, polarity, category, value
        không phân biệt hoa thường) trả 409 theo unique index của DB.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientPreferenceCreate'
      responses:
        '201':
          description: Thêm xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /recipients/{id}/preferences/{preferenceId}:
    get:
      tags: [Người nhận]
      operationId: getPreference
      summary: Lấy 1 sở thích
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: preferenceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServerId'
      responses:
        '200':
          description: Sở thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreference'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Người nhận]
      operationId: updatePreference
      summary: Sửa sở thích
      description: >
        UC-04. Sửa được value, polarity, isActive và confirmedAt
        (đánh dấu đã xác nhận sở thích do AI suy ra).
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: preferenceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientPreferenceUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Người nhận]
      operationId: deletePreference
      summary: Xóa sở thích
      description: UC-04. Xóa mềm (deleted_at).
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: preferenceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServerId'
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
