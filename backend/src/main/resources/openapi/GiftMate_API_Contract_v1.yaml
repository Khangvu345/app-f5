                type: array
                items:
                  $ref: '#/components/schemas/PlanLimit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      operationId: updateAdminPlanLimits
      summary: Chỉnh hạn mức 1 gói
      description: >
        UC-16. Chỉ role ADMIN. Chỉnh số lượt gợi ý tối đa/ngày và số sản phẩm
        tối đa/lượt (X/Y của Premium) hoặc giới hạn người nhận. Giá trị âm hoặc
        thiếu trường bắt buộc trả 400. Thay đổi áp dụng ngay (real-time).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanLimitsUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      tags: [Admin]
      operationId: getAdminUsers
      summary: Liệt kê tài khoản người dùng
      description: >
        UC-16. Chỉ role ADMIN. Danh sách tài khoản để Admin chọn khi cấp
        trial Premium hoặc đổi gói. Lọc theo planType, role, status và
        tìm theo email.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
            description: Tìm theo email hoặc tên hiển thị
        - name: planType
          in: query
          required: false
          schema:
            type: string
            enum: [FREE, PREMIUM]
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [USER, ADMIN]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DISABLED, DELETED]
      responses:
        '200':
          description: Danh sách tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/plan:
    patch:
      tags: [Admin]
      operationId: updateUserPlan
      summary: Đổi gói của 1 tài khoản
      description: >
        UC-16. Chỉ role ADMIN. Nâng/hạ gói FREE/PREMIUM của user (không cần
        ngày hết hạn ở v1 — xem POST /admin/users/{id}/trial-premium).
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      responses:
        '200':
          description: Đổi gói xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT (TTL 1h). Gửi trong header Authorization.
        Hết hạn thì dùng POST /auth/refresh để đổi token mới.
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang, bắt đầu từ 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Số bản ghi mỗi trang
    IdParam:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ServerId'
      description: ID BIGINT của bản ghi
  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa đăng nhập hoặc token hết hạn/sai
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không có quyền (không phải ADMIN, không phải chủ sở hữu, hoặc vượt hạn mức gói)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy bản ghi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột dữ liệu (trùng, chuyển trạng thái sai)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: Hết quota AI trong ngày
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AiNotImplemented:
      description: Nhóm AI chưa triển khai ở v1 (Q3)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ServerId:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '42'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi, vd VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, AI_QUOTA_EXCEEDED, AI_NOT_IMPLEMENTED, EXPORT_FORMAT_NOT_SUPPORTED, RECIPIENT_LIMIT_REACHED
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo lỗi đọc được (tiếng Việt)
          example: Tên người nhận không được để trống
        details:
          type: array
          description: Chi tiết từng lỗi field (nếu có)
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: Không được để trống
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: khanh@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          description: Mật khẩu tối thiểu 8 ký tự
        displayName:
          type: string
          maxLength: 100
          example: Khánh
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: khanh@example.com
        password:
          type: string
          format: password
    OAuthRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: ID token do Google hoặc Apple cấp sau khi user đăng nhập trên app
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token nhận được lúc đăng nhập (server chỉ lưu hash SHA-256)
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT access token, TTL 1h
        refreshToken:
          type: string
          description: Refresh token, hết hạn sau 30 ngày; xoay vòng mỗi lần refresh
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: TTL của access token tính bằng giây
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'
    LocalId:
      type: string
      format: uuid
    GuestRecipient:
      allOf:
        - $ref: '#/components/schemas/RecipientCreate'
        - type: object
          required: [localId]
          properties:
            localId: {$ref: '#/components/schemas/LocalId'}
    GuestEvent:
      type: object
      required: [localId, title, eventType, originalDay, originalMonth, recipientLocalIds]
      properties:
        localId: {$ref: '#/components/schemas/LocalId'}
        title:
          type: string
          maxLength: 150
        eventType:
          type: string
          enum: [BIRTHDAY, ANNIVERSARY, WEDDING, GRADUATION, HOLIDAY, CUSTOM]
        occasionType:
          type: string
          enum: [BIRTHDAY, ANNIVERSARY, HOLIDAY, OTHER]
        calendarType:
          type: string
          enum: [SOLAR, LUNAR]
          default: SOLAR
        originalDay:
          type: integer
          minimum: 1
          maximum: 31
        originalMonth:
          type: integer
          minimum: 1
          maximum: 12
        originalYear:
          type: integer
        isYearKnown:
          type: boolean
        isLunarLeapMonth:
          type: boolean
        recurrenceFrequency:
          type: string
          enum: [NONE, ANNUAL]
          default: ANNUAL
        leapDayPolicy:
          type: string
          enum: [FEB28, MAR01, SKIP]
        timezone:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultBudget:
          type: number
        notes:
          type: string
          maxLength: 500
        recipientLocalIds:
          type: array
          minItems: 1
          description: >
            Mảng đầu vào (suy ra, không phải cột DB) — map sang bảng nối
            event_recipients. Bắt buộc ít nhất 1 người nhận (trigger DB chặn
            lưu sự kiện không có người nhận).
          items:
            $ref: '#/components/schemas/LocalId'
    GuestGift:
      type: object
      required: [localId, name, recipientLocalId]
      properties:
        localId: {$ref: '#/components/schemas/LocalId'}
        name:
          type: string
          maxLength: 200
        recipientLocalId:
          $ref: '#/components/schemas/LocalId'
        occurrenceId:
          $ref: '#/components/schemas/ServerId'
        suggestionId:
          $ref: '#/components/schemas/ServerId'
        category:
          type: string
          maxLength: 80
        estimatedAmount:
          type: number
        productUrl:
          type: string
          format: uri
        imageUrl:
          type: string
        note:
          type: string
    SyncRequest:
      type: object
      properties:
        recipients:
          type: array
          items: {$ref: '#/components/schemas/GuestRecipient'}
        events:
          type: array
          items: {$ref: '#/components/schemas/GuestEvent'}
        gifts:
          type: array
          items: {$ref: '#/components/schemas/GuestGift'}
    SyncResponse:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            type: object
            required: [entityType, localId, serverId]
            properties:
              entityType: {type: string, enum: [recipient, event, gift]}
              localId: {$ref: '#/components/schemas/LocalId'}
              serverId: {$ref: '#/components/schemas/ServerId'}
    UserProfile:
      type: object
      description: >
        Hồ sơ gộp users + user_settings cho GET /users/me. Trường user là
        object lồng (suy ra, không phải cột DB).
      required: [id, email, displayName, role, status, planType]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        email:
          type: [string, "null"]
          format: email
          description: NULL với tài khoản chỉ đăng nhập OAuth chưa nhập email
        authProvider:
          type: [string, "null"]
          enum: [EMAIL, GOOGLE, APPLE, null]
          description: >
            Cách đăng nhập (bảng users.authProvider, Q2: không có FACEBOOK)
        displayName:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
        planType:
          type: string
          enum: [FREE, PREMIUM]
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        locale:
          type: string
          example: vi
        currency:
          type: string
          example: VND
        createdAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: Mật khẩu hiện tại để xác nhận xóa tài khoản (D14, v1 chưa có OTP)
    UserSettings:
      type: object
      description: Map 1-1 bảng user_settings
      required: [displayName, timezone, locale, currency, defaultReminderTime, defaultReminderOffsets, notificationsEnabled, hideGiftOnLockscreen, aiEnabled, planType]
      properties:
        displayName:
          type: string
          maxLength: 100
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
          example: Asia/Ho_Chi_Minh
        locale:
          type: string
          default: vi
          example: vi
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: VND
          example: VND
        defaultReminderTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          default: '09:00'
          description: Giờ nhắc mặc định, định dạng HH:mm
          example: '09:00'
        defaultReminderOffsets:
          type: array
          description: Các mốc nhắc mặc định (số ngày trước sự kiện)
          default: [14, 7, 3, 1, 0]
          items:
            type: integer
            enum: [14, 7, 3, 1, 0]
        notificationsEnabled:
          type: boolean
          default: true
        hideGiftOnLockscreen:
          type: boolean
          default: true
        aiEnabled:
          type: boolean
          default: true
        planType:
          type: string
          enum: [FREE, PREMIUM]
    UserSettingsUpdate:
      type: object
      properties:
        timezone:
          type: string
        locale:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        defaultReminderTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        defaultReminderOffsets:
          type: array
          items:
            type: integer
            enum: [14, 7, 3, 1, 0]
        notificationsEnabled:
          type: boolean
        hideGiftOnLockscreen:
          type: boolean
        aiEnabled:
          type: boolean
    ExportData:
      type: object
      description: Toàn bộ dữ liệu cá nhân của user, xuất dạng JSON (UC-03)
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        settings:
          $ref: '#/components/schemas/UserSettings'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        gifts:
          type: array
          items:
            $ref: '#/components/schemas/Gift'
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
        exportedAt:
          type: string
          format: date-time
    PlanLimit:
      type: object
      description: Map 1-1 bảng plan_limits
      required: [planType, limitKey, limitValue]
      properties:
        planType:
          type: string
          enum: [FREE, PREMIUM]
        limitKey:
          type: string
          enum: [recipient_limit, ai_requests_per_day, active_gift_ideas]
        limitValue:
          type: [integer, "null"]
          description: NULL = chưa điền, server chặn fail-closed, không coi là không giới hạn
          example: 20
        unit:
          type: [string, "null"]
          example: nguoi
    PlanLimitsUpdate:
      type: object
      required: [planType, limits]
      properties:
        planType:
          type: string
          enum: [FREE, PREMIUM]
        limits:
          type: array
          minItems: 1
          items:
            type: object
            required: [limitKey, limitValue]
            properties:
              limitKey:
                type: string
                enum: [recipient_limit, ai_requests_per_day, active_gift_ideas]
              limitValue:
                type: [integer, "null"]
                minimum: 0
                description: Đặt NULL để đánh dấu chưa điền (fail-closed)
    PlanUpdate:
      type: object
      required: [planType]
      properties:
        planType:
          type: string
          enum: [FREE, PREMIUM]
    AdminUser:
      type: object
      description: Tài khoản user nhìn từ phía Admin (UC-16)
      required: [id, email, displayName, role, status, planType]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        email:
          type: [string, "null"]
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
        planType:
          type: string
          enum: [FREE, PREMIUM]
        createdAt:
          type: string
          format: date-time
    AdminUserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    Recipient:
      type: object
      example: {id: '42', name: Lan, relationship: PARTNER, isFavourite: false}
      description: Map 1-1 bảng recipients
      required: [id, name, relationship, isFavourite]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        name:
          type: string
          maxLength: 150
        relationship:
          type: [string, "null"]
          enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER, null]
        relationshipDetail:
          type: [string, "null"]
          maxLength: 100
          description: Ghi chú thêm về mối quan hệ, vd "Bạn đại học"
        ageGroup:
          type: [string, "null"]
          enum: [CHILD, TEEN, ADULT, SENIOR, UNKNOWN, null]
        birthDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: Đi cùng birthMonth (cả hai có hoặc cả hai không)
        birthMonth:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        birthYear:
          type: [integer, "null"]
        notes:
          type: [string, "null"]
          maxLength: 500
        isFavourite:
          type: boolean
          default: false
        version:
          type: integer
          description: Optimistic locking (cột version của bảng)
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecipientCreate:
      type: object
      example: {name: Lan, relationship: PARTNER}
      required: [name, relationship]
      properties:
        name:
          type: string
          pattern: '\S'
          maxLength: 150
        relationship:
          type: string
          enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
        relationshipDetail:
          type: string
          maxLength: 100
        ageGroup:
          type: string
          enum: [CHILD, TEEN, ADULT, SENIOR, UNKNOWN]
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
        birthYear:
          type: integer
        notes:
          type: string
          maxLength: 500
        isFavourite:
          type: boolean
    RecipientUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        relationship:
          type: string
          enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
        relationshipDetail:
          type: string
          maxLength: 100
        ageGroup:
          type: string
          enum: [CHILD, TEEN, ADULT, SENIOR, UNKNOWN]
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
        birthYear:
          type: integer
        notes:
          type: string
          maxLength: 500
        isFavourite:
          type: boolean
    RecipientPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 3
    RecipientPreference:
      type: object
      description: Map 1-1 bảng recipient_preferences
      required: [id, recipientId, category, value, polarity, source, isActive]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        recipientId:
          $ref: '#/components/schemas/ServerId'
        category:
          type: string
          maxLength: 80
          example: Đồ ăn
        value:
          type: string
          maxLength: 200
          example: Trà sữa
        polarity:
          type: string
          enum: [LIKE, DISLIKE, AVOID]
        source:
          type: string
          enum: [USER, AI_INFERRED]
        confirmedAt:
          type: [string, "null"]
          format: date-time
          description: Thời điểm user xác nhận sở thích do AI suy ra
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecipientPreferenceCreate:
      type: object
      required: [category, value, polarity]
      properties:
        category:
          type: string
          maxLength: 80
        value:
          type: string
          maxLength: 200
        polarity:
          type: string
          enum: [LIKE, DISLIKE, AVOID]
        source:
          type: string
          enum: [USER, AI_INFERRED]
          default: USER
    RecipientPreferenceUpdate:
      type: object
      properties:
        value:
          type: string
          maxLength: 200
        polarity:
          type: string
          enum: [LIKE, DISLIKE, AVOID]
        isActive:
          type: boolean
        confirmedAt:
          type: string
          format: date-time
    RecipientPreferencePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecipientPreference'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 2
    Event:
      type: object
      description: Map 1-1 bảng events
      required: [id, title, eventType, calendarType, originalDay, originalMonth, recurrenceFrequency]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        title:
          type: string
          maxLength: 150
        eventType:
          type: string
