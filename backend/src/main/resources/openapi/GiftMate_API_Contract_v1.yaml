            $ref: '#/components/schemas/UserDevice'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    AiSuggestionRequest:
      type: object
      description: Đầu vào cho POST /ai/suggestions (UC-14)
      required: [recipientId]
      properties:
        recipientId:
          $ref: '#/components/schemas/ServerId'
        occurrenceId:
          $ref: '#/components/schemas/ServerId'
          description: Dịp tặng (để lấy eventType, ngày diễn ra)
        budgetMin:
          type: number
          description: Khoảng giá tối thiểu, VND
        budgetMax:
          type: number
          description: Khoảng giá tối đa, VND
        additionalInstruction:
          type: string
          description: Ghi chú thêm cho AI, vd "người nhận thích đồ thủ công"
    AiSuggestion:
      type: object
      description: Map 1-1 bảng ai_suggestions (tối đa 5 gợi ý / 1 request)
      required: [id, requestId, position, title]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        requestId:
          $ref: '#/components/schemas/ServerId'
        position:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 200
        category:
          type: [string, "null"]
          maxLength: 100
        estimatedPriceMin:
          type: [number, "null"]
        estimatedPriceMax:
          type: [number, "null"]
        reason:
          type: [string, "null"]
          description: Lý do AI gợi ý món này
        caution:
          type: [string, "null"]
          description: Lưu ý khi mua/tặng món này
        canonicalKey:
          type: [string, "null"]
          maxLength: 150
        duplicateGiftId:
          anyOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Món quà đã tặng trước đây trùng với gợi ý này (nếu có)
        hiddenAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    AiRequest:
      type: object
      description: Map 1-1 bảng ai_requests (1 hàng / 1 lần gọi AI)
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        recipientId:
          anyOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
        occurrenceId:
          anyOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
        budgetMin:
          type: [number, "null"]
        budgetMax:
          type: [number, "null"]
        additionalInstruction:
          type: [string, "null"]
        status:
          type: string
          enum: [QUEUED, GENERATED, FAILED, PARTIAL]
        modelName:
          type: [string, "null"]
          maxLength: 100
        tokenInput:
          type: [integer, "null"]
        tokenOutput:
          type: [integer, "null"]
        costCents:
          type: [integer, "null"]
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AiSuggestion'
          description: Tối đa 5 gợi ý, chỉ có khi lấy chi tiết 1 request
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    AiRequestPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiRequest'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 2
    AiQuota:
      type: object
      description: Quota AI của user trong ngày Việt Nam (reset 00:00 VN)
      required: [planType, requestsUsedToday, suggestionsPerRequest, quotaDate]
      properties:
        planType:
          type: string
          enum: [FREE, PREMIUM]
        requestsUsedToday:
          type: integer
          description: Số lượt đã dùng hôm nay (chỉ tính GENERATED/PARTIAL)
          example: 1
        requestsPerDay:
          type: [integer, "null"]
          description: >
            Hạn mức lượt/ngày. Free: 2 (UC-14). Premium: X theo cấu hình Admin.
            NULL = chưa điền, server chặn fail-closed.
          example: 2
        suggestionsPerRequest:
          type: integer
          description: >
            Số sản phẩm tối đa mỗi lượt. Free: 3 (UC-14). Premium: Y.
          example: 3
        quotaDate:
          type: string
          format: date
          description: Ngày Việt Nam mà quota này áp dụng
    AiSuggestionSave:
      type: object
      properties:
        occurrenceId:
          $ref: '#/components/schemas/ServerId'
          description: Gắn món quà đã lưu vào 1 lần diễn ra (tùy chọn)
        note:
          type: string
          description: Ghi chú thêm khi lưu vào kho ý tưởng
    SuggestionFeedbackCreate:
      type: object
      description: >
        Phản hồi cho 1 gợi ý AI (UC-15, D12). Chỉ nhận lý do theo enum của
        suggestion_feedback; không có cảm xúc Thích/Không thích.
      properties:
        reason:
          type: [string, "null"]
          enum: [TOO_EXPENSIVE, ALREADY_GIVEN, NOT_MATCHING_INTERESTS, NOT_MATCHING_OCCASION, OTHER, null]
        detail:
          type: string
          description: Ghi chú thêm về phản hồi
    SuggestionFeedback:
      type: object
      description: Map 1-1 bảng suggestion_feedback (1 phản hồi / 1 gợi ý)
      required: [id, suggestionId]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        suggestionId:
          $ref: '#/components/schemas/ServerId'
        reason:
          type: [string, "null"]
          enum: [TOO_EXPENSIVE, ALREADY_GIVEN, NOT_MATCHING_INTERESTS, NOT_MATCHING_OCCASION, OTHER, null]
        detail:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    AdminAiStats:
      type: object
      description: >
        1 hàng của view v_ai_daily_stats: thống kê theo ngày Việt Nam + model.
        Không có thời gian phản hồi trung bình và tỉ lệ lỗi/Fallback (D13).
      required: [statDate, model, requests, failedRequests, totalTokensIn, totalTokensOut, totalCostCents]
      properties:
        statDate:
          type: string
          format: date
          description: Ngày theo giờ Việt Nam
        model:
          type: string
          description: Tên model, 'unknown' nếu không ghi model
          example: gpt-4o-mini
        requests:
          type: integer
          description: Số lượt gọi thành công (GENERATED/PARTIAL)
        failedRequests:
          type: integer
          description: Số lượt gọi lỗi (FAILED)
        totalTokensIn:
          type: integer
        totalTokensOut:
          type: integer
        totalCostCents:
          type: integer
          description: Tổng chi phí API tính bằng cents
