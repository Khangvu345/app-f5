openapi: 3.1.0
info:
  title: GiftMate API
  version: 1.0.0
  description: >
    API contract v1 của GiftMate — nguồn duy nhất (contract-first, hướng A).
    Base path /api/v1. Auth: Bearer JWT, mọi dữ liệu scoping theo user_id.
    ID là BIGINT, trả dạng số JSON (không dạng chuỗi). Tiền VND NUMERIC(18,2).
    Ngày giờ ISO 8601 theo Asia/Ho_Chi_Minh. Xóa mềm (deleted_at), DELETE trả 204.
    Nhóm AI (UC-14/UC-15) có trong contract để đủ map 16 UC nhưng CHƯA TRIỂN KHAI
    ở đợt này (phát triển sau, Q3) — gọi endpoint AI trước khi triển khai sẽ trả 501.
    Trial Premium (Q5) chờ quyết định nhóm — v1 chưa có premium_until.
    OAuth chỉ Google + Apple (Q2: bỏ Facebook khỏi UC-01, enum auth_provider giữ EMAIL/GOOGLE/APPLE, không sửa DB).
  license:
    name: Chưa công bố — nội bộ dự án GiftMate
    identifier: LicenseRef-Proprietary
  contact:
    name: GiftMate
servers:
  - url: http://localhost:8080
    description: Backend local theo application.yaml (port 8080)
tags:
  - name: Auth
    description: Đăng ký, đăng nhập, OAuth, refresh token, đồng bộ Guest (UC-01, UC-02)
  - name: Tài khoản
    description: Hồ sơ cá nhân, đổi mật khẩu, xuất/xóa dữ liệu (UC-02, UC-03)
  - name: Cài đặt
    description: Cài đặt người dùng (UC-02)
  - name: Người nhận
    description: Hồ sơ người nhận và sở thích (UC-04, UC-05)
  - name: Sự kiện
    description: Sự kiện lặp, lịch, lần diễn ra (UC-06, UC-07)
  - name: Nhắc nhở
    description: Quy tắc nhắc, thông báo, thiết bị push (UC-08)
  - name: Ngân sách
    description: Ngân sách năm/sự kiện và tổng hợp chi tiêu (UC-09, UC-10)
  - name: Quà và chi
    description: Ý tưởng quà, vòng đời quà, chi phí, kiểm tra trùng (UC-11, UC-12, UC-13)
  - name: AI
    description: Gợi ý quà AI, quota, phản hồi (UC-14, UC-15) — CHƯA TRIỂN KHAI ở v1
  - name: Admin
    description: Thống kê AI, hạn mức, cấp Premium (UC-16)
security:
  - BearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Đăng ký tài khoản mới bằng email
      description: >
        UC-01. Tạo tài khoản EMAIL (auth_provider=EMAIL). Email phải duy nhất;
        trùng email trả 409. Tạo kèm user_settings mặc định (timezone
        Asia/Ho_Chi_Minh, locale vi, currency VND, plan FREE).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Đăng nhập bằng email/mật khẩu
      description: >
        UC-01. Sai email hoặc sai mật khẩu trả 401 (không phân biệt lý do).
        Trả access token (TTL 1h theo application.yaml) + refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/oauth/{provider}:
    post:
      tags: [Auth]
      operationId: oauthLogin
      summary: Đăng nhập bằng tài khoản Google hoặc Apple
      description: >
        UC-01. Chỉ hỗ trợ GOOGLE và APPLE (Q2: bỏ Facebook). Provider khác trả 400.
        Body chứa id_token do nhà cung cấp cấp. Lần đầu đăng nhập: tạo user mới
        (auth_provider=GOOGLE/APPLE, provider_subject lấy từ id_token) + user_settings
        mặc định. Đã có tài khoản cùng provider_subject thì đăng nhập thẳng.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [GOOGLE, APPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Đổi refresh token lấy access token mới
      description: >
        UC-01, Q6. Server chỉ lưu hash SHA-256 của refresh token (bảng refresh_tokens),
        không lưu token gốc. Refresh thành công: thu hồi token cũ (revoked_at) và
        cấp refresh token mới (xoay vòng). Token hết hạn hoặc đã thu hồi trả 401.
        Refresh token hết hạn sau 30 ngày.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Đăng xuất, thu hồi refresh token
      description: >
        UC-02. Thu hồi refresh token gửi kèm (nếu có) và kết thúc phiên. Access token
        còn hạn vẫn dùng được tới khi hết TTL 1h (không có blacklist ở v1).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sync:
    post:
      tags: [Auth]
      operationId: syncGuestData
      summary: Đồng bộ dữ liệu Guest (cục bộ) vào tài khoản
      description: >
        UC-01 (D6). Sau khi Guest đăng ký/đăng nhập, gom dữ liệu cục bộ (người nhận,
        sự kiện, quà) gộp vào tài khoản. Server tạo mới các bản ghi, bỏ qua bản ghi
        đã tồn tại (trùng tên người nhận / trùng sự kiện). Chỉ nhận dữ liệu của chính
        user đang đăng nhập.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Đồng bộ xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags: [Tài khoản]
      operationId: getMe
      summary: Lấy hồ sơ của mình
      description: >
        UC-02. Trả thông tin users + user_settings gộp (display_name, plan_type,
        timezone, locale, currency). Không có trường avatar (D11: v2.2 không có
        cột avatar).
      responses:
        '200':
          description: Hồ sơ hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Tài khoản]
      operationId: updateMe
      summary: Cập nhật tên hiển thị
      description: >
        UC-02. Chỉ đổi được display_name (cột user_settings.display_name).
        Các cài đặt khác đổi qua PATCH /users/me/settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Tài khoản]
      operationId: deleteMe
      summary: Xóa tài khoản vĩnh viễn
      description: >
        UC-03, D14. Bắt buộc gửi mật khẩu hiện tại trong body để xác nhận
        (v1 chưa có hạ tầng OTP nên chỉ dùng mật khẩu). Sai mật khẩu trả 401
        và hủy tiến trình. Xóa mềm trước (deleted_at), dữ liệu liên quan
        cascade theo FK; tài khoản chuyển status DELETED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Tài khoản đã xóa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    patch:
      tags: [Tài khoản]
      operationId: changePassword
      summary: Đổi mật khẩu
      description: >
        UC-02. Mật khẩu cũ không đúng trả 400. Tài khoản đăng nhập bằng OAuth
        (không có password_hash) đổi mật khẩu trả 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu xong
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/export:
    get:
      tags: [Tài khoản]
      operationId: exportMe
      summary: Xuất dữ liệu cá nhân (JSON)
      description: >
        UC-03. Xuất toàn bộ dữ liệu của user (hồ sơ, người nhận, sự kiện, quà,
        chi phí, ngân sách) dạng JSON. Q8: v1 chỉ JSON, format=pdf trả 400
        (mã EXPORT_FORMAT_NOT_SUPPORTED). UC-03 nhắc xác nhận bằng mật khẩu/OTP:
        v1 chưa có hạ tầng OTP nên dùng xác nhận mật khẩu qua header
        X-Confirm-Password (không bắt buộc ở v1, ghi nhận để làm sau).
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json]
            default: json
      responses:
        '200':
          description: File dữ liệu JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/settings:
    get:
      tags: [Cài đặt]
      operationId: getMySettings
      summary: Lấy cài đặt của mình
      description: >
        UC-02. Trả toàn bộ hàng user_settings (múi giờ, ngôn ngữ, tiền tệ,
        giờ nhắc mặc định, các mốc nhắc, bật/tắt thông báo, ẩn quà ở màn hình
        khóa, bật AI, gói hiện tại).
      responses:
        '200':
          description: Cài đặt hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Cài đặt]
      operationId: updateMySettings
      summary: Cập nhật cài đặt
      description: >
        UC-02. Chỉ cập nhật các trường gửi kèm. default_reminder_offsets chỉ
        nhận các mốc 14, 7, 3, 1, 0. plan_type không đổi qua endpoint này
        (đổi gói do Admin cấp qua UC-16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /recipients:
    get:
      tags: [Người nhận]
      operationId: listRecipients
      summary: Liệt kê người nhận của mình
      description: >
        UC-05. Tìm theo tên (search, không phân biệt hoa thường) và lọc theo
        mối quan hệ (relationship). Sắp xếp theo tên. Không trả bản ghi đã
        xóa mềm.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
            description: Từ khóa tìm theo tên người nhận
        - name: relationship
          in: query
          required: false
          schema:
            type: string
            enum: [FAMILY, FRIEND, PARTNER, COLLEAGUE, TEACHER, OTHER]
      responses:
        '200':
          description: Danh sách người nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Người nhận]
      operationId: createRecipient
      summary: Tạo người nhận mới
      description: >
        UC-04. Tên bắt buộc (bỏ trống trả 400). Gói Free giới hạn 20 người nhận
        (plan_limits FREE.recipient_limit); vượt giới hạn trả 403 mã
        RECIPIENT_LIMIT_REACHED. birth_day và birth_month phải đi cùng nhau
        (cả hai có hoặc cả hai không) theo CHECK của DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientCreate'
      responses:
        '201':
          description: Tạo xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /recipients/{id}:
    get:
      tags: [Người nhận]
      operationId: getRecipient
      summary: Lấy 1 người nhận
      description: >
        UC-04. Chỉ thấy người nhận của chính mình; của người khác trả 404
        (không lộ sự tồn tại).
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Người nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Người nhận]
      operationId: updateRecipient
      summary: Sửa người nhận
      description: UC-04. Chỉ cập nhật các trường gửi kèm. Không phải chủ sở hữu trả 404.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Người nhận]
      operationId: deleteRecipient
      summary: Xóa người nhận
      description: >
        UC-04. Xóa mềm (deleted_at). Dữ liệu liên quan (sở thích, quà, event_recipients)
        cascade theo FK. Không phải chủ sở hữu trả 404.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /recipients/{id}/preferences:
    get:
      tags: [Người nhận]
      operationId: listPreferences
      summary: Liệt kê sở thích của 1 người nhận
      description: >
        UC-04. Lọc theo polarity (LIKE/DISLIKE/AVOID). Mặc định chỉ trả
        sở thích đang hoạt động (is_active=true); truyền include_inactive=true
        để lấy cả sở thích đã tắt.
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: polarity
          in: query
          required: false
          schema:
            type: string
            enum: [LIKE, DISLIKE, AVOID]
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Danh sách sở thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreferencePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Người nhận]
      operationId: createPreference
      summary: Thêm sở thích cho người nhận
      description: >
        UC-04. Trùng sở thích (cùng recipient, polarity, category, value
        không phân biệt hoa thường) trả 409 theo unique index của DB.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientPreferenceCreate'
      responses:
        '201':
          description: Thêm xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /recipients/{id}/preferences/{preferenceId}:
    get:
      tags: [Người nhận]
      operationId: getPreference
      summary: Lấy 1 sở thích
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: preferenceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sở thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreference'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Người nhận]
      operationId: updatePreference
      summary: Sửa sở thích
      description: >
        UC-04. Sửa được value, polarity, is_active và confirmed_at
        (đánh dấu đã xác nhận sở thích do AI suy ra).
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: preferenceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientPreferenceUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Người nhận]
      operationId: deletePreference
      summary: Xóa sở thích
      description: UC-04. Xóa mềm (deleted_at).
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: preferenceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events:
    get:
      tags: [Sự kiện]
      operationId: listEvents
      summary: Liệt kê sự kiện của mình
      description: >
        UC-06, UC-07. Lọc theo loại dịp (event_type) và khoảng ngày
        (start_date, end_date lọc theo local_date của lần diễn ra).
        Sắp xếp theo ngày diễn ra gần nhất.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            enum: [BIRTHDAY, ANNIVERSARY, WEDDING, GRADUATION, HOLIDAY, CUSTOM]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sự kiện]
      operationId: createEvent
      summary: Tạo sự kiện mới
      description: >
        UC-06. Bắt buộc có ít nhất 1 người nhận (recipient_ids, tối thiểu 1 phần tử)
        — DB có trigger deferred chặn lưu sự kiện không có người nhận. Tạo event
        và event_recipients trong cùng 1 transaction. Ngày không hợp lệ
        (vd. ngày 31 tháng 2, end_date trước start_date) trả 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Tạo xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{id}:
    get:
      tags: [Sự kiện]
      operationId: getEvent
      summary: Lấy 1 sự kiện
      description: UC-06. Chỉ thấy sự kiện của chính mình; của người khác trả 404.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sự kiện]
      operationId: updateEvent
      summary: Sửa sự kiện
      description: >
        UC-06. Chỉ cập nhật các trường gửi kèm. Đổi người nhận của sự kiện
        dùng POST/DELETE /events/{id}/recipients, không dùng endpoint này.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Cập nhật xong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sự kiện]
      operationId: deleteEvent
      summary: Xóa sự kiện
      description: >
        UC-06. Xóa mềm (deleted_at). Các lần diễn ra và nhắc nhở liên quan
        cascade theo FK.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/calendar:
    get:
      tags: [Sự kiện]
      operationId: getCalendar
      summary: Xem lịch theo tháng
      description: >
        UC-07. Trả các lần diễn ra (occurrence) trong khoảng from–to
        (mặc định tháng hiện tại theo Asia/Ho_Chi_Minh). Mỗi item gồm
        occurrence_id, event_id, event_title (lấy từ events.title qua join),
        local_date và status.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Ngày bắt đầu khoảng xem (mặc định ngày 1 tháng hiện tại)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Ngày kết thúc khoảng xem (mặc định cuối tháng hiện tại)
      responses:
        '200':
          description: Các lần diễn ra trong khoảng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/upcoming:
    get:
      tags: [Sự kiện]
      operationId: getUpcoming
      summary: Sự kiện sắp tới
      description: >
        UC-07. Danh sách các lần diễn ra sắp tới theo thứ tự thời gian
        (local_date tăng dần). Mặc định 30 ngày tới; truyền days để đổi
        (tối đa 365). Không có sự kiện nào trả danh sách rỗng.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Sự kiện sắp tới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/{id}/recipients:
    get:
      tags: [Sự kiện]
      operationId: listEventRecipients
