  /gifts/{id}/status:
    patch:
      tags: [Quà và chi]
      operationId: updateGiftStatus
      summary: Chuyển trạng thái quà
      description: >
        UC-12. Vòng đời duy nhất: IDEA → CONSIDERING → SELECTED → PURCHASED →
        GIVEN (+ RETURNED/CANCELLED). Chuyển sai bị chặn 409 (trigger DB
        trg_gift_status_transition là lưới cuối, app cũng phải chặn ở UI).
        Chuyển sang PURCHASED bắt buộc có purchasedOn; chuyển sang GIVEN
        nên có givenOn. Hợp lệ: IDEA→CONSIDERING/SELECTED/CANCELLED,
        CONSIDERING→IDEA/SELECTED/CANCELLED, SELECTED→CONSIDERING/PURCHASED/CANCELLED,
        PURCHASED→GIVEN/RETURNED/CANCELLED, GIVEN→RETURNED.
