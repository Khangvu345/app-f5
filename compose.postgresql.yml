services:
  giftmate-schema-db:
    build:
      context: .
      dockerfile: Dockerfile.postgresql
    image: giftmate-postgresql:local
    environment:
      POSTGRES_DB: giftmate
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
    ports:
      - "127.0.0.1:${GIFTMATE_SCHEMA_DB_PORT:-5433}:5432"
    volumes:
      - giftmate-schema-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  giftmate-schema-data:
